<section  id="hero" #heroSection class="hero section-base">
  <div class="scrollNow">
    Scroll <i class="fa-solid fa-angles-down"></i>
  </div>
  <img class="bg_hero" decoding="async" loading="eager" src="assets/BG-HERO.jpg" alt="">

  <div #heroLoader class="hero__loader">

    <div #loaderText class="hero__loader-text">
      <span class="char">J</span>
      <span class="char">N</span> 
      <span class="char">B</span>
    </div>

    <div class="hero__loader-bar">
      <div #loaderBar class="hero__loader-bar-fill"></div>
    </div>

  </div>

  <!-- <div #blob class="hero__blob" aria-hidden="true"></div> -->

  <div class="hero__blob hero__blob--top" aria-hidden="true"></div>
  <div class="hero__blob hero__blob--bottom" aria-hidden="true"></div>


  <div class="hero__grid container-portfolio">

    <a #ownerName class="hero__name">
      {{ owner.name }}
      <span #pill class="pill">{{ owner.funBadge }}</span>
    </a>
    <p #titleSwitcher class="hero__title hero__title-switcher">
      {{ owner.title }}
    </p>

    <p class="hero__tagline">
      @for (line of owner.tagline.split('\n'); track $index) {
      {{ line }}<br />
      }
    </p>

    <p class="hero__location">
      <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
        <path
          d="M7 1C4.79 1 3 2.79 3 5C3 8.25 7 13 7 13C7 13 11 8.25 11 5C11 2.79 9.21 1 7 1ZM7 6.5C6.17 6.5 5.5 5.83 5.5 5C5.5 4.17 6.17 3.5 7 3.5C7.83 3.5 8.5 4.17 8.5 5C8.5 5.83 7.83 6.5 7 6.5Z"
          fill="currentColor" />
      </svg>
      <span>
        {{ owner.location }}
      </span>
    </p>

    <button (click)="scrollTo('#contact')" class="reach__btn">
      Reach out
    </button>

        } @else {
        {{ part.text }}
        }
        }
      </p>

      <p>
        @for (part of bioParts2; track $index) {
        @if (part.highlight) {
        <strong>{{ part.text }}</strong>
        } @else {
        {{ part.text }}
        }
        }
      </p>

      
    </div> -->
  </div>


</section>
